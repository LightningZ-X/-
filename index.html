<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>整机功耗计算器 · 已搬到新地址</title>
<!--
  这个仓库（LightningZ-X/-）已经废弃，站点搬到了账号根路径的用户站仓库。
  这里只留一个跳转页，让以前分享出去的 /-/ 链接不至于断掉。
  带 search 与 hash 一起转发：旧的配置短码链接（/-/#c=…）也能照常打开。
-->
<link rel="canonical" href="https://lightningz-x.github.io/">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=https://lightningz-x.github.io/">
<style>
  html, body { margin: 0; height: 100%; background: #121212; color: #e8e8e8;
    font: 14px/1.7 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: grid; place-items: center; text-align: center; }
  p { margin: 6px 0; }
  a { color: #ff0033; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .dim { color: #8a8a8a; font-size: 12px; }
</style>
</head>
<body>
  <div>
    <p>这个工具已经搬到新地址</p>
    <p><a href="https://lightningz-x.github.io/">https://lightningz-x.github.io/</a></p>
    <p class="dim">没有自动跳过去的话，点上面的链接。</p>
  </div>
  <script>
    /* 把 query 与 hash 一起带过去，旧的配置链接才不会丢参数 */
    location.replace('https://lightningz-x.github.io/' + location.search + location.hash);
  </script>
</body>
</html>
